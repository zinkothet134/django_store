{% extends "admin/base.html" %}
{% load static %}

{% block title %}CHUE Family Back Office{% endblock %}

{% block branding %}
<div class="modern-branding">
  <div class="logo-icon">C</div>
  <div class="branding-text">
    <div class="main-title">CHUE Family Back Office</div>
    <div class="sub-title">Warehouse, Products, Invoices and Access Control</div>
  </div>
</div>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
  :root {
    --primary-dark: #0f172a;
    --accent-blue: #2563eb;
    --bg-canvas: #f1f5f9; /* Soft grey so white cards pop */
    --text-header: #1e293b;
    --border-subtle: #e2e8f0;
    --max-content-width: 1400px;
  }

  /* --- 1. Centering the Layout --- */
  #content {
    max-width: var(--max-content-width) !important;
    margin: 0 auto !important; /* Centers the content */
    padding: 30px 20px !important;
    float: none !important; /* Overrides Django's default floats */
  }

  /* Centering the Breadcrumbs to match content */
  div.breadcrumbs {
    padding: 15px calc((100% - var(--max-content-width)) / 2 + 20px) !important;
    background: #ffffff !important;
    border-bottom: 1px solid var(--border-subtle) !important;
  }
  
  /* Fallback for breadcrumbs if screen is smaller than max-width */
  @media (max-width: 1400px) {
    div.breadcrumbs { padding: 15px 20px !important; }
  }

  /* --- 2. Improving App Name Visibility --- */
  /* This targets the "App Name" headers in the sidebar and main dashboard */
  .module h2, .module caption, #nav-sidebar caption {
    background: var(--primary-dark) !important; /* Dark background so white text is visible */
    color: #ffffff !important;
    padding: 14px 18px !important;
    font-weight: 600 !important;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    border-radius: 12px 12px 0 0 !important;
  }

  #nav-sidebar .module {
    border: none !important;
    background: #ffffff !important;
    margin-bottom: 20px !important;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    border-radius: 12px;
  }

  /* --- 3. Modernizing the Branding --- */
  #header {
    background: var(--primary-dark) !important;
    padding: 12px 24px !important;
  }

  .modern-branding {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .logo-icon {
    width: 42px;
    height: 42px;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 800;
    font-size: 20px;
  }

  .main-title { font-size: 20px; font-weight: 700; color: white; }
  .sub-title { font-size: 12px; color: #94a3b8; }

  /* --- 4. Dashboard Grid Improvements --- */
  .dashboard #content-main {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 25px;
    width: 100%;
  }

  .module {
    border: 1px solid var(--border-subtle) !important;
    border-radius: 12px !important;
    overflow: hidden;
    background: #ffffff !important;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
  }

  /* --- 5. Responsive Fixes --- */
  @media (max-width: 1024px) {
    #content {
      padding: 20px 15px !important;
    }
    
    /* On tablets, allow cards to be 2-column or 1-column */
    .dashboard #content-main {
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }
  }

  @media (max-width: 767px) {
    #nav-sidebar {
      display: none; /* Standard behavior for mobile admin */
    }
    #content {
      width: 100% !important;
      padding: 15px !important;
    }
  }
</style>
{% endblock %}
