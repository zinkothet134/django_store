{% extends "base.html" %}
{% block content %}
<style>
  .qr-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-gap: 10px;
  }
  .qr-img {
    width: 50mm;
    height: 50mm;
    object-fit: contain;
  }
  .qr-grid > div {
    page-break-inside: avoid;
    break-inside: avoid;
  }
</style>
<div class="container py-4 text-center">
  <h2>Print QR</h2>
  <p><b>{{ product.product_name }}</b> ({{ product.sku }})</p>

  {% if product.qr_code %}
    <div class="qr-grid">
      {% for i in "123456789012345" %}
        <div style="text-align:center; page-break-inside: avoid; border:1px dashed #999; padding:6px; border-radius:6px;">
          <img src="{{ product.qr_code.url }}" alt="QR" class="qr-img">
          <div style="font-size:11px; font-weight:600; margin-top:4px;">{{ product.product_name }}</div>
          <div style="font-size:10px; color:#555;">{{ product.sku }}</div>
        </div>
      {% endfor %}
    </div>
    <div class="mt-3">
      <button class="btn btn-primary" onclick="window.print()">Print</button>
    </div>
  {% else %}
    <p>No QR generated yet.</p>
  {% endif %}
</div>
{% endblock %}
