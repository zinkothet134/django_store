<!DOCTYPE html>
<html>
<head>
    <title>Print QR Codes</title>

    <style>
        @page {
            size: A4 portrait;
            margin: 10mm;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #000000;
        }

        body {
            margin: 0 auto;
            padding: 12px;
            max-width: 190mm;
        }

        .print-toolbar {
            padding: 10px 0 14px;
            text-align: center;
        }

        .print-btn {
            padding: 8px 14px;
            border: 1px solid #222;
            background: #222;
            color: #fff;
            cursor: pointer;
            border-radius: 6px;
            font-size: 12px;
        }

        .page-title {
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 12px;
        }

        .page-subtitle {
            text-align: center;
            font-size: 12px;
            color: #555;
            margin: 0 0 16px;
        }

        .qr-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8mm 6mm;
            align-items: start;
        }

        .qr-card {
            width: 100%;
            border: 1px dashed #b5b5b5;
            border-radius: 8px;
            padding: 4mm 3mm;
            text-align: center;
            page-break-inside: avoid;
            break-inside: avoid;
            background: #fff;
        }

        .qr-inner {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 46mm;
        }

        .qr-box {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-bottom: 2mm;
        }

        .qr-box canvas,
        .qr-box img {
            display: block;
            max-width: 100%;
            height: auto;
        }

        .qr-name {
            font-size: 10.5px;
            font-weight: 700;
            line-height: 1.2;
            margin-top: 1mm;
            word-break: break-word;
        }

        .qr-sku {
            font-size: 9.5px;
            color: #444;
            line-height: 1.2;
            word-break: break-word;
            margin-top: 1mm;
        }

        @media print {
            html, body {
                background: #fff;
            }

            body {
                width: auto;
                max-width: none;
                margin: 0;
                padding: 0;
            }

            .print-toolbar,
            .page-title,
            .page-subtitle {
                display: none !important;
            }

            .qr-grid {
                gap: 6mm 5mm;
            }

            .qr-card {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                -webkit-column-break-inside: avoid;
            }
        }
    </style>
</head>

<body>

<div class="print-toolbar">
    <button class="print-btn" onclick="window.print()">Print A4 Labels</button>
</div>

<h2 class="page-title">Product QR Labels</h2>
<p class="page-subtitle">A4 layout optimized to reduce paper waste and keep each QR label on a single page.</p>

<div class="qr-grid">
    {% for product in products %}
        <div class="qr-card">
            <div class="qr-inner">
                <div class="qr-box" data-qr="{{ product.sku }}"></div>
                <div class="qr-name">{{ product.product_name }}</div>
                <div class="qr-sku">{{ product.sku }}</div>
            </div>
        </div>
    {% endfor %}
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
    document.querySelectorAll('.qr-box').forEach(function(el) {
        new QRCode(el, {
            text: el.dataset.qr,
            width: 84,
            height: 84
        });
    });
</script>

</body>
</html>
